services:
  # FastAPI backend
  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      # Defaults to the mongo container below. If backend/.env sets
      # MONGO_URI (e.g. a MongoDB Atlas address) that wins, and the mongo
      # container simply sits unused.
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/digital_vault}
      # The Firebase key is mounted as a secret at /run/secrets/firebase_key,
      # never copied into the image.
      - FIREBASE_CREDENTIALS=/run/secrets/firebase_key
    secrets:
      - firebase_key
    volumes:
      # Uploaded documents live here, not in the container's writable layer,
      # so they survive restarts, rebuilds and `docker compose down`.
      - uploads-data:/usr/src/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  # MongoDB. Not published to the host: only the api container needs it,
  # and leaving 27017 open on your PC would expose an unauthenticated
  # database to anything on your network.
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped

secrets:
  firebase_key:
    file: ./firebase-service-account.json

volumes:
  mongo-data:
  uploads-data:
