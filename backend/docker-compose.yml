version: '3.8'

services:
  # 1. FastAPI API Container
  api:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/digital_vault}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in backend_python/.env}
      - JWT_EXPIRES_DAYS=${JWT_EXPIRES_DAYS:-30}
    volumes:
      # Uploaded documents would otherwise live only in the container's
      # writable layer and vanish on rebuild/recreate.
      - uploads-data:/usr/src/app/uploads
    depends_on:
      - mongo
    restart: always

  # 2. NoSQL Database Container (MongoDB) -- used unless MONGO_URI in .env
  # points elsewhere (e.g. a MongoDB Atlas cluster).
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: always

volumes:
  mongo-data:
  uploads-data:
