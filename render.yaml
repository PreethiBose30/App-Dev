# Render Blueprint: deploys the FastAPI backend from backend/Dockerfile.
# Secrets are NOT stored here. MONGO_URI is entered in the Render dashboard
# and the Firebase key is added there as a Secret File.
services:
  - type: web
    name: digital-vault-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "5000"
      - key: MONGO_URI
        sync: false
      - key: FIREBASE_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
